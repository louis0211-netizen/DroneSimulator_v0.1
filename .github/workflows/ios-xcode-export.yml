name: iOS Xcode Export

on:
  workflow_dispatch:

jobs:
  ios-xcode-export:
    name: Export iOS Xcode project
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-iOS-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-iOS-

      - name: Build iOS Xcode project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.23f1
          targetPlatform: iOS
          buildsPath: build

      - name: Upload Xcode project
        uses: actions/upload-artifact@v4
        with:
          name: DroneSimulator-iOS-XcodeProject
          path: build

